name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: decypharr/web/package-lock.json

      - name: Build frontend assets
        working-directory: decypharr/web
        run: |
          npm ci
          npm run build

      - name: Verify checked-in assets are up to date
        run: git diff --exit-code -- decypharr/web/static/build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests in Docker
        run: docker compose -f docker-compose.ci.yml up --build --exit-code-from decypharr-py
