<div class="auth-page">
    <sl-card class="auth-card">
        <h2>Login</h2>
        <form id="loginForm">
            <sl-input
                id="username"
                name="username"
                label="Username"
                required
                autofocus
            ></sl-input>
            <sl-input
                id="password"
                name="password"
                label="Password"
                type="password"
                password-toggle
                required
            ></sl-input>
            <sl-button type="submit" variant="primary" style="width:100%">Login</sl-button>
        </form>
    </sl-card>
</div>

<script type="module">
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const btn = e.target.querySelector('sl-button[type="submit"]')
        btn.loading = true

        try {
            const resp = await window.decypharrUtils.fetcher('/login', {
                method: 'POST',
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            })
            if (resp.ok) {
                window.decypharrUtils.createToast('Login successful! Redirecting...', 'success')
                setTimeout(() => { window.location.href = window.urlBase || '/' }, 1000)
            } else {
                const text = await resp.text()
                throw new Error(text || 'Invalid credentials')
            }
        } catch (err) {
            window.decypharrUtils.createToast(err.message || 'Login failed.', 'error')
        } finally {
            btn.loading = false
        }
    })
</script>
