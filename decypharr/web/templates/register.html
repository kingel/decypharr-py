<div class="auth-page">
    <wa-card class="auth-card">
        <h2>First Time Auth Setup</h2>
        <form id="authForm">
            <wa-input
                id="username"
                name="username"
                label="Username"
                required
                autofocus
            ></wa-input>
            <wa-input
                id="password"
                name="password"
                label="Password"
                type="password"
                password-toggle
                required
            ></wa-input>
            <wa-input
                id="confirmPassword"
                name="confirmPassword"
                label="Confirm Password"
                type="password"
                password-toggle
                required
            ></wa-input>
            <wa-button type="submit" variant="primary" style="width:100%">Save</wa-button>
        </form>
    </wa-card>
</div>

<script type="module">
    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = document.getElementById('password').value
        const confirm = document.getElementById('confirmPassword').value

        if (password !== confirm) {
            window.decypharrUtils.createToast('Passwords do not match!', 'error')
            return
        }

        const btn = e.target.querySelector('wa-button[type="submit"]')
        btn.loading = true

        try {
            const formData = new FormData()
            formData.append('username', document.getElementById('username').value)
            formData.append('password', password)
            formData.append('confirmPassword', confirm)

            const resp = await window.decypharrUtils.fetcher('/register', {
                method: 'POST',
                body: formData,
            })
            if (resp.ok) {
                window.location.href = window.decypharrUtils.joinURL(window.urlBase, '/')
            } else {
                const text = await resp.text()
                window.decypharrUtils.createToast(text || 'Registration failed', 'error')
            }
        } catch (err) {
            window.decypharrUtils.createToast('Registration failed: ' + err.message, 'error')
        } finally {
            btn.loading = false
        }
    })
</script>
